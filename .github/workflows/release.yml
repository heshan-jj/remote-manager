name: Release hhj-ssh-setup

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.3.0)'
        required: true
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Unit Tests
        run: cargo test

      - name: Build Windows x64 Release EXE
        run: cargo build --release

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: hhj-ssh-setup ${{ inputs.tag || github.ref_name }}
          files: |
            target/release/hhj-ssh-setup.exe
